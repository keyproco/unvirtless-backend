services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: unvirtless-backend-dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - backend_vendor:/var/www/vendor
    expose:
      - "9000"
    networks:
      - unvirtless

  caddy:
    image: caddy:2
    container_name: unvirtless-caddy-dev
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/var/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - unvirtless

  postgres:
    image: postgres:19-trixie
    container_name: unvirtless-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-unvirtless}
      POSTGRES_USER: ${DB_USERNAME:-unvirtless}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hellopassword}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unvirtless

networks:
  unvirtless:
    driver: bridge

volumes:
  backend_vendor:
  caddy_data:
  caddy_config:
  postgres_data: